name: Test and Release Docker Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test and build modern interface
        working-directory: gui-next
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn install --frozen-lockfile --ignore-engines
          yarn typecheck
          yarn i18n-check
          yarn lint
          yarn test
          OUTPUT_DIR=../service/server/router/web yarn build
      - name: Build classic interface and test node editor
        working-directory: gui
        run: |
          yarn install --frozen-lockfile --ignore-engines
          yarn test:node-editor
          OUTPUT_DIR=../service/server/router/web/legacy yarn build
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.10'
          cache-dependency-path: service/go.sum
      - name: Service regression tests
        run: CGO_ENABLED=0 go test ./...
      - name: Service regression tests with SQLite runtime
        run: CGO_ENABLED=0 V2RAYA_TEST_DATABASE_BACKEND=sqlite go test ./server/service
      - name: Database race tests
        run: go test -race ./common/instancelock ./db/... ./cmd/v2raya-db ./server/service
      - name: SQLite service race tests
        run: V2RAYA_TEST_DATABASE_BACKEND=sqlite go test -race ./server/service
      - name: Isolated service HTTP persistence and rollback
        run: |
          CGO_ENABLED=0 go build -o "$RUNNER_TEMP/v2raya-runtime" .
          CGO_ENABLED=0 go build -o "$RUNNER_TEMP/v2raya-runtime-db" ./cmd/v2raya-db
          docker pull alpine:3.23
          python3 ../scripts/test-sqlite-runtime.py --service "$RUNNER_TEMP/v2raya-runtime" --db "$RUNNER_TEMP/v2raya-runtime-db"
      - uses: docker/setup-qemu-action@v3
      - name: Run static database binaries on both release architectures
        shell: bash
        run: |
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -o "$RUNNER_TEMP/v2raya-db-$arch" ./cmd/v2raya-db
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go test -c -o "$RUNNER_TEMP/sqlitebackup-$arch.test" ./db/sqlitebackup
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go test -c -o "$RUNNER_TEMP/store-$arch.test" ./db/store
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go test -c -o "$RUNNER_TEMP/sqlitestore-$arch.test" ./db/sqlitestore
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go test -c -o "$RUNNER_TEMP/runtimebackend-$arch.test" ./db/runtimebackend
            docker run --rm --platform "linux/$arch" --network none --read-only \
              --mount "type=bind,src=$RUNNER_TEMP/v2raya-db-$arch,dst=/v2raya-db,readonly" \
              --entrypoint /v2raya-db alpine:3.23 sqlite-info
            docker run --rm --platform "linux/$arch" --network none --read-only --tmpfs /tmp:rw,mode=1777 \
              --mount "type=bind,src=$RUNNER_TEMP/sqlitebackup-$arch.test,dst=/sqlitebackup.test,readonly" \
              --entrypoint /sqlitebackup.test alpine:3.23 -test.v -test.timeout=5m
            docker run --rm --platform "linux/$arch" --network none --read-only --tmpfs /tmp:rw,mode=1777 \
              --mount "type=bind,src=$RUNNER_TEMP/store-$arch.test,dst=/store.test,readonly" \
              --entrypoint /store.test alpine:3.23 -test.v -test.timeout=5m
            docker run --rm --platform "linux/$arch" --network none --read-only --tmpfs /tmp:rw,mode=1777 \
              --mount "type=bind,src=$RUNNER_TEMP/sqlitestore-$arch.test,dst=/sqlitestore.test,readonly" \
              --entrypoint /sqlitestore.test alpine:3.23 -test.v -test.timeout=5m
            docker run --rm --platform "linux/$arch" --network none --read-only --tmpfs /tmp:rw,mode=1777 \
              --mount "type=bind,src=$RUNNER_TEMP/runtimebackend-$arch.test,dst=/runtimebackend.test,readonly" \
              --entrypoint /runtimebackend.test alpine:3.23 -test.v -test.timeout=5m
          done

  build-and-push:
    # Branch pushes, pull requests and manual runs validate without publishing.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for git describe --tags to work inside Dockerfile

      - name: Validate release tag
        id: release
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import re
          import sys

          number = r"(?:0|[1-9][0-9]*)"
          identifier = r"(?:0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)"
          pattern = rf"v{number}\.{number}\.{number}(?:-(?P<prerelease>{identifier}(?:\.{identifier})*))?"
          tag = os.environ["GITHUB_REF_NAME"]
          match = re.fullmatch(pattern, tag)
          if match is None or len(tag[1:]) > 128:
              sys.exit("Release tags must be vMAJOR.MINOR.PATCH, optionally followed by a SemVer prerelease; build metadata is not supported.")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"stable={'true' if match['prerelease'] is None else 'false'}\n")
          PY

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ steps.release.outputs.stable == 'true' }}
            type=sha,prefix=
            type=raw,value=latest,enable=${{ steps.release.outputs.stable == 'true' }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64 # Build for both x86_64 and ARM64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
